<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFD" />
      <stop offset="50%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="750" fill="url(#bg-grad)" />

  <!-- Subtle Geometric Architectural Accent Circles in Royal Indigo & Purple -->
  <circle cx="500" cy="180" r="140" fill="#E0E7FF" opacity="0.6" />
  <circle cx="100" cy="520" r="180" fill="#EDE9FE" opacity="0.6" />
  
  <!-- Subtle Framing Line -->
  <rect x="25" y="25" width="550" height="700" rx="20" fill="none" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.8" />

  <!-- Professional Portrait Silhouette & Structure -->
  <g transform="translate(0, 40)">
    <!-- Shoulders / Blazer -->
    <path d="M120 630 C130 520, 200 440, 300 440 C400 440, 470 520, 480 630 L480 710 L120 710 Z" fill="url(#suit-grad)" filter="url(#soft-shadow)" />
    
    <!-- Lapels -->
    <path d="M240 450 L300 580 L230 650 L200 600 Z" fill="#2E1065" />
    <path d="M360 450 L300 580 L370 650 L400 600 Z" fill="#1E1B4B" />
    
    <!-- Inner Blouse / Shirt -->
    <path d="M265 440 L300 520 L335 440 Z" fill="#FFFFFF" />
    <path d="M280 440 L300 485 L320 440 Z" fill="#F8FAFC" />

    <!-- Neck -->
    <path d="M265 340 L265 450 C265 460, 335 460, 335 450 L335 340 Z" fill="#E2C4B1" />

    <!-- Head & Face -->
    <path d="M225 240 C225 150, 375 150, 375 240 C375 325, 350 375, 300 375 C250 375, 225 325, 225 240 Z" fill="#E8C5AC" />

    <!-- Professional Hair Style -->
    <path d="M220 220 C215 130, 280 90, 300 90 C320 90, 385 130, 380 220 C375 250, 385 320, 395 380 C390 400, 375 420, 365 400 C360 330, 365 240, 360 210 C350 150, 250 150, 240 210 C235 240, 240 330, 235 400 C225 420, 210 400, 205 380 C215 320, 225 250, 220 220 Z" fill="#1C1917" />
    
    <!-- Hair Detail Top -->
    <path d="M245 135 C270 110, 330 110, 355 135 C320 120, 280 120, 245 135 Z" fill="#292524" opacity="0.6" />

    <!-- Subtle Facial Features / Minimalist Elegance -->
    <!-- Eyebrows -->
    <path d="M252 215 C265 210, 280 214, 285 218" stroke="#44403C" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M348 215 C335 210, 320 214, 315 218" stroke="#44403C" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Eyes -->
    <path d="M256 230 C265 225, 278 226, 283 232" stroke="#1C1917" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M344 230 C335 225, 322 226, 317 232" stroke="#1C1917" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="270" cy="231" r="2" fill="#1C1917" />
    <circle cx="330" cy="231" r="2" fill="#1C1917" />

    <!-- Nose line -->
    <path d="M300 230 L297 265 L305 268" stroke="#CFA588" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Gentle Confident Smile -->
    <path d="M280 295 C290 305, 310 305, 320 295" stroke="#9E5D4B" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Bottom Badge Plaque: "PALLAVI RATHOD" in Royal Indigo & Purple -->
  <g transform="translate(150, 660)" filter="url(#soft-shadow)">
    <rect width="300" height="54" rx="27" fill="#FFFFFF" stroke="#312E81" stroke-width="1.5" />
    <text x="150" y="25" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="19" font-weight="700" fill="#1E1B4B" letter-spacing="2">PALLAVI RATHOD</text>
    <text x="150" y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#6D28D9" letter-spacing="1.5">MBA · FINANCE &amp; HR</text>
  </g>
</svg>
